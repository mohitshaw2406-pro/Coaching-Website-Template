<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Notice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="padding: 50px; text-align: center;">
    <h2>Update Student Notice Board</h2>
    <form method="POST" style="max-width: 400px; margin: auto;">
        <input type="text" name="title" placeholder="Notice Title" required style="width:100%; padding:10px; margin-bottom:10px;">
        <textarea name="content" placeholder="Type notice here..." required style="width:100%; height:100px; padding:10px; margin-bottom:10px;"></textarea>
        <button type="submit" style="background:#764ba2; color:white; padding:10px 20px; border:none; border-radius:10px; cursor:pointer;">Post Notice</button>
    </form>
    <button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
