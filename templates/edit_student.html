<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_dashboard.css') }}">
    <style>
        .edit-card { background: white; padding: 35px; border-radius: 15px; max-width: 500px; margin: 40px auto; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .edit-card h2 { color: #764ba2; margin-bottom: 25px; }
        .edit-card label { font-size: 0.9rem; color: #555; display: block; margin-bottom: 5px; }
        .edit-card input, .edit-card select { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; font-family: inherit; box-sizing: border-box; }
        .edit-card button { background: #764ba2; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .edit-card button:hover { background: #5a3580; }
        .cancel-link { margin-left: 15px; color: #764ba2; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <a href="{{ url_for('admin_dashboard') }}">📩 Enquiries</a>
        <a href="{{ url_for('students_section') }}" style="background:#334155">🎓 Students</a>
        <a href="{{ url_for('manage_teachers') }}">👨‍🏫 Teachers</a>
        <a href="{{ url_for('manage_timetable') }}">📅 Timetable</a>
        <a href="{{ url_for('logout') }}" class="logout">🚪 Logout</a>
    </aside>
    <main class="main">
        <div class="edit-card">
            <h2>✏️ Edit Student</h2>
            <form method="POST" enctype="multipart/form-data">
                <label>Current Profile Photo</label>
                <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 14px;">
                    {% if student['photo_url'] %}
                    <img src="{{ student['photo_url'] }}" alt="{{ student[1] }}" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid #764ba2;">
                    <span style="font-size: 0.85rem; color: #555;">Photo uploaded</span>
                    {% else %}
                    <div style="width: 72px; height: 72px; border-radius: 50%; background: #f3eafa; color: #764ba2; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.4rem; border: 2px dashed #764ba2;">
                        {{ student[1][0].upper() if student[1] else '?' }}
                    </div>
                    <span style="font-size: 0.85rem; color: #888;">No photo uploaded yet</span>
                    {% endif %}
                </div>

                <label>Update Photo <span style="color:#999; font-size:0.8rem;">(optional, max 2MB — leave blank to keep current)</span></label>
                <input type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/gif">

                <label>Full Name</label>
                <input type="text" name="name" value="{{ student[1] }}" required>

                <label>Class</label>
                <select name="class_name" required>
                    {% for i in range(6, 13) %}
                    <option value="{{ i }}" {% if student[2] == i|string %}selected{% endif %}>Class {{ i }}</option>
                    {% endfor %}
                </select>

                <label>Mobile Number</label>
                <input type="tel" name="mobile" value="{{ student[3] if student[3] else '' }}" placeholder="Mobile Number">

                <label>New Password <span style="color:#999; font-size:0.8rem;">(leave blank to keep current)</span></label>
                <input type="password" name="password" placeholder="New password (optional)">

                <button type="submit">Update Student</button>
                <a href="{{ url_for('students_section') }}" class="cancel-link">Cancel</a>
            </form>
        </div>
    </main>
</div>
<button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
