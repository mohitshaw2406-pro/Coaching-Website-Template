<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teacher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="padding: 50px;">
    <h2>Edit Teacher Details</h2>
    <form method="POST">
        <label>Username:</label><br>
        <input type="text" name="username" value="{{ teacher[1] }}" required><br><br>
        <label>Subject:</label><br>
        <input type="text" name="subject" value="{{ teacher[2] }}" required><br><br>
        <label>Assigned Classes:</label><br>
        <input type="text" name="classes" value="{{ teacher[3] }}" required><br><br>
        <button type="submit" style="background:#764ba2; color:white; padding:10px 20px; border:none;">Update Teacher</button>
        <a href="{{ url_for('manage_teachers') }}">Cancel</a>
    </form>
<button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
