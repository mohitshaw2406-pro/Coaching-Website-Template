<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Your Coaching Name</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="logo">⭐ Your Coaching Name</div>
        <nav><a href="/">Home</a></nav>
    </header>

    <div class="contact-container">
        <div class="contact-card">
            <h1>Get In Touch 👋</h1>
            <p style="color: var(--muted); font-weight: 600; margin-bottom: 28px;">Have questions? We're here to help you grow.</p>

            <div class="contact-item">
                <span>📍</span>
                <div>
                    <strong>Our Locations</strong><br>
                    Unit 1: [Your Address 1]<br>
                    Unit 2: [Your Address 2]<br>
                    Unit 3: [Your Address 3]
                </div>
            </div>
            <div class="contact-item">
                <span>📞</span>
                <div><strong>Mobile:</strong> [Your Phone]</div>
            </div>
            <div class="contact-item">
                <span>📧</span>
                <div><strong>Email:</strong> [Your Email]</div>
            </div>
            <div class="contact-item">
                <span>⏰</span>
                <div><strong>Hours:</strong> Mon – Sat: 10:00 AM – 8:00 PM</div>
            </div>
        </div>
    </div>

    <button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
