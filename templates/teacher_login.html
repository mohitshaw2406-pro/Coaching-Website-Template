<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teacher Login - Your Coaching Name</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2>👨‍🏫 Teacher Login</h2>
        <p class="subtitle">Welcome back, Teacher!</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="flash-msg error">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('teacher_login') }}">
            <input type="text" name="username" placeholder="Teacher Username" required autocomplete="username">
            <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Login</button>
        </form>

        <p class="switch-text"><a href="{{ url_for('home') }}">← Back to Home</a></p>
    </div>
</div>
<button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
